<body>
  <!-- Bot flotante: primero en el body para que empiece a cargar de inmediato -->
  <iframe
    id="botlode-player"
    style="
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 140px;
      height: 140px;
      border: none;
      z-index: 9998;
      pointer-events: none;
      background: transparent !important;
      background-color: transparent !important;
      -webkit-background-color: transparent !important;
      opacity: 0;
      overflow: hidden;
      will-change: width, height;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    "
    allow="clipboard-write"
    loading="lazy"
    allowtransparency="true">
  </iframe>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var player = document.getElementById('botlode-player');
      if (player && !player.src) {
        player.src = 'https://botlode-player.vercel.app?botId=0b99e786-fa91-42ba-9578-5784f5049140&v=2.5';
        console.log('🤖 BotLode Player iframe cargado tras primer frame de Flutter');
      }
    });
    setTimeout(function() {
      var player = document.getElementById('botlode-player');
      if (player && !player.src) {
        player.src = 'https://botlode-player.vercel.app?botId=0b99e786-fa91-42ba-9578-5784f5049140&v=2.5';
        console.log('🤖 BotLode Player iframe cargado por timeout (5s)');
      }
    }, 5000);
  </script>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading-splash');
      if (loading) {
        loading.classList.add('fade-out');
        setTimeout(function() {
          loading.remove();
          document.body.style.overflow = 'auto';
        }, 500);
      }
    });
  </script>

  <script src="botlode-chat.js" defer></script>

  <script>
    var path = window.location.pathname;
    var head = document.getElementsByTagName('head')[0];
    var canonical = document.querySelector('link[rel="canonical"]');
    if (!canonical) {
      canonical = document.createElement('link');
      canonical.setAttribute('rel', 'canonical');
      head.appendChild(canonical);
    }
    if (path === '/' || path === '') {
      canonical.setAttribute('href', 'https://www.theapexweb.com/');
    } else if (path.startsWith('/services')) {
      canonical.setAttribute('href', 'https://www.theapexweb.com/services');
    } else if (path.startsWith('/about')) {
      canonical.setAttribute('href', 'https://www.theapexweb.com/about');
    } else if (path.startsWith('/contact')) {
      canonical.setAttribute('href', 'https://www.theapexweb.com/contact');
    } else {
      canonical.setAttribute('href', 'https://www.theapexweb.com/');
    }
  </script>
