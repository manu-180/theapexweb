<!--
  BOTLODE EMBED COMPLETO - Código único para copiar y pegar en cualquier web.
  Incluye: conectividad WiFi (alertas solo si show_offline_alert=true),
  botón WhatsApp (si wpp=true), iframe y burbuja con fondo transparente.

  USO: Pegar TODO este contenido justo ANTES de </body> en tu HTML.
  Reemplazar BOT_ID_PLACEHOLDER por tu botId (ej: 0038971a-da75-4ddc-8663-d52a6b8f2936).

  FONDO: Este embed NO define fondo en body. La burbuja/iframe son transparentes.
  Si ves "fondo negro" es el background de tu página; cámbialo en tu CSS (body { background: ... }).
  El panel del chat (interior) tiene su tema en el BotLode Player (Flutter).
-->

<script>

function init(){inj();create();window.addEventListener('message',onMsg);window.addEventListener('online',onWinOnline);window.addEventListener('offline',onWinOffline);}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>

<script>
(function(){ var BOT_ID='BOT_ID_PLACEHOLDER'; var PLAYER_URL='https://botlode-player.vercel.app'; var player=document.getElementById('botlode-player'); if(!player)return; function load(){ if(player.src)return; player.src=PLAYER_URL+'?botId='+BOT_ID+'&v=2.5'; } if(window.addEventListener) window.addEventListener('flutter-first-frame',load); setTimeout(load,5000); })();

<script type="text/javascript">

  function isNarrowScreen(){return window.innerWidth<600;}
