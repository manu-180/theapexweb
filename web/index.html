  <link rel="manifest" href="manifest.json">

  <style>
    /* Oculta los controles de video nativos de Chromium (Edge/Chrome) */
    video::-webkit-media-controls {
      display: none !important;
    }
    video::-webkit-media-controls-enclosure {
      display: none !important;
    }
    
    /* Deshabilita la interacción directa con el tag de vídeo para que Edge 
       no inyecte su botón de "Vídeo inteligente" o "Picture-in-Picture".
    */
    video {
      pointer-events: none !important;
      -webkit-touch-callout: none !important;
      
      -webkit-user-select: none !important; /* Safari/Chrome/Edge */
      -moz-user-select: none !important;    /* Firefox */
      -ms-user-select: none !important;     /* Internet Explorer/Edge Antiguo */
      user-select: none !important;         /* Propiedad estándar */
    }
  </style>
</head>
