<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Manuel Navarro - Full-Stack Developer Portfolio.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="APEX">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Manuel Navarro - Full-Stack Developer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Oculta los controles de video nativos de Chromium (Edge/Chrome) */
    video::-webkit-media-controls {
      display: none !important;
    }
    video::-webkit-media-controls-enclosure {
      display: none !important;
    }
    
    /* Deshabilita la interacción directa con el tag de vídeo para que Edge 
       no inyecte su botón de "Vídeo inteligente" o "Picture-in-Picture".
    */
    video {
      pointer-events: none !important;
      -webkit-touch-callout: none !important;
      
      -webkit-user-select: none !important; /* Safari/Chrome/Edge */
      -moz-user-select: none !important;    /* Firefox */
      -ms-user-select: none !important;     /* Internet Explorer/Edge Antiguo */
      user-select: none !important;         /* Propiedad estándar */
    }

    /* === CONNECTIVITY SNACKBARS === */
    #offline-overlay {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 100000;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 16px 24px 16px;
      pointer-events: none;
    }
    #offline-overlay .offline-snackbar {
      pointer-events: auto;
      max-width: 520px;
      width: 100%;
      padding: 14px 20px 16px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(40, 0, 0, 0.95), rgba(10, 0, 0, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.16);
      transform: translateY(120%);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.3s ease-out;
    }
    body.offline #offline-overlay .offline-snackbar {
      transform: translateY(0);
      opacity: 1;
    }
    #offline-text { 
      font-size: 13px; 
      line-height: 1.4; 
      color: rgba(255, 255, 255, 0.8); 
      margin: 8px 0;
    }
    #offline-chip {
      display: inline-flex; 
      align-items: center; 
      gap: 10px;
      padding: 6px 12px; 
      border-radius: 999px;
      border: 1px solid rgba(255, 60, 60, 0.35);
      background: rgba(0, 0, 0, 0.6);
      margin-bottom: 10px;
    }
    #offline-wifi-icon {
      width: 22px; 
      height: 22px;
      color: #ff3c3c;
      stroke-width: 2.2;
      filter: drop-shadow(0 0 4px rgba(255, 60, 60, 0.5));
      flex-shrink: 0;
    }
    #offline-dot {
      width: 10px; 
      height: 10px; 
      border-radius: 50%;
      background: #ff1744;
      flex-shrink: 0;
      animation: offline-dot-pulse 1.8s ease-in-out infinite;
    }
    @keyframes offline-dot-pulse {
      0%, 100% { 
        opacity: 1; 
        transform: scale(1);
        box-shadow: 0 0 12px rgba(255, 23, 68, 0.9), 0 0 20px rgba(255, 23, 68, 0.5); 
      }
      50% { 
        opacity: 0.3; 
        transform: scale(0.85);
        box-shadow: 0 0 4px rgba(255, 23, 68, 0.4); 
      }
    }
    #offline-chip span {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.95);
      white-space: nowrap;
    }
    #offline-footer {
      margin-top: 10px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.65);
    }
    #offline-footer strong {
      color: rgba(255, 60, 60, 0.9);
      font-weight: 700;
    }

    /* === RESTORED OVERLAY === */
    #restored-overlay {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 99999;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 16px 24px 16px;
      pointer-events: none;
    }
    #restored-overlay .restored-snackbar {
      pointer-events: auto;
      max-width: 520px;
      width: 100%;
      padding: 14px 20px 16px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(0, 80, 45, 0.96), rgba(0, 55, 30, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.18);
      transform: translateY(120%);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.3s ease-out;
    }
    #restored-overlay.show .restored-snackbar {
      transform: translateY(0);
      opacity: 1;
    }
    #restored-chip {
      display: inline-flex; 
      align-items: center; 
      gap: 10px;
      padding: 6px 12px; 
      border-radius: 999px;
      border: 1px solid rgba(0, 255, 148, 0.35);
      background: rgba(0, 0, 0, 0.25);
      margin-bottom: 10px;
    }
    #restored-check-icon {
      width: 22px; 
      height: 22px;
      color: #00ff94;
      stroke-width: 2.5;
      filter: drop-shadow(0 0 4px rgba(0, 255, 148, 0.5));
      flex-shrink: 0;
    }
    #restored-chip span {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.95);
      white-space: nowrap;
    }
    #restored-text { 
      font-size: 13px; 
      line-height: 1.45; 
      color: rgba(255, 255, 255, 0.95); 
      font-weight: 500; 
      margin: 8px 0; 
    }
    #restored-footer { 
      margin-top: 10px; 
      font-size: 11px; 
      color: rgba(255, 255, 255, 0.7); 
    }

    /* === BOTLODE CHAT ASSISTANT === */
    #botlode-wrapper { 
      position: fixed; 
      bottom: 35px; 
      right: 35px; 
      z-index: 98000;
    }
    
    #backdrop {
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh;
      display: none; 
      z-index: 97999;
    }

    #botlode-iframe { 
      position: absolute; 
      width: 450px; 
      height: 750px; 
      max-height: 85vh; 
      bottom: -40px; 
      right: -40px; 
      border: none; 
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); 
      pointer-events: none; 
    }

    #interaction-proxy { 
      position: absolute; 
      bottom: 0; 
      right: 0; 
      width: 72px; 
      height: 72px; 
      border-radius: 50%; 
      cursor: pointer; 
      background: rgba(255, 255, 255, 0.01); 
      pointer-events: auto; 
    }
    
    #botlode-wrapper.expanded #botlode-iframe { 
      width: 400px; 
      bottom: 0; 
      right: 0; 
      pointer-events: auto;
      border-radius: 28px; 
      box-shadow: 0 20px 60px rgba(0,0,0,0.5); 
    }
    
    #botlode-wrapper.expanded #interaction-proxy { 
      display: none; 
    }
    
    body.chat-open #backdrop { 
      display: block; 
    }
  </style>
</head>
<body>
  <!-- Connectivity Overlays -->
  <div id="offline-overlay">
    <div class="offline-snackbar" id="offline-panel">
      <div id="offline-chip">
        <svg id="offline-wifi-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
          <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
          <circle cx="12" cy="20" r="1"/>
          <line x1="2" y1="2" x2="22" y2="22"/>
        </svg>
        <div id="offline-dot"></div>
        <span>Sin conexión a internet</span>
      </div>
      <p id="offline-text">Se ha perdido la conexión a internet. Cuando la señal esté disponible, podés seguir navegando con normalidad.</p>
      <div id="offline-footer"><span>Estado: <strong>red no disponible</strong></span></div>
    </div>
  </div>
  
  <div id="restored-overlay">
    <div class="restored-snackbar">
      <div id="restored-chip">
        <svg id="restored-check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <path d="M8 12l3 3 5-6"/>
        </svg>
        <span>Conexión restablecida</span>
      </div>
      <p id="restored-text">La conexión a internet se ha restablecido correctamente. Podés seguir navegando con normalidad.</p>
      <div id="restored-footer">Estado: conectado</div>
    </div>
  </div>

  <!-- BotLode Chat Assistant -->
  <div id="backdrop"></div>
  <div id="botlode-wrapper">
    <iframe 
      id="botlode-iframe" 
      src="https://botlode-player.vercel.app/" 
      allow="microphone; clipboard-write"
      allowtransparency="true"
      style="background-color: transparent;"
    ></iframe>
    <div id="interaction-proxy"></div>
  </div>

  <script>
    // Connectivity detection
    let wentOfflineOnce = false;
    const restoredOverlay = document.getElementById('restored-overlay');

    window.addEventListener('online', function() {
      document.body.classList.remove('offline');
      if (wentOfflineOnce) {
        wentOfflineOnce = false;
        if (restoredOverlay) {
          restoredOverlay.classList.add('show');
          setTimeout(function() {
            restoredOverlay.classList.remove('show');
          }, 4000);
        }
      }
    });

    window.addEventListener('offline', function() {
      wentOfflineOnce = true;
      document.body.classList.add('offline');
    });

    // Check initial state
    if (!navigator.onLine) {
      document.body.classList.add('offline');
    }
  </script>

  <script>
    // BotLode Chat Assistant
    const wrapper = document.getElementById('botlode-wrapper');
    const iframe = document.getElementById('botlode-iframe');
    const proxy = document.getElementById('interaction-proxy');
    const backdrop = document.getElementById('backdrop');

    // 1. RASTREO DE MOUSE
    document.addEventListener('mousemove', (e) => {
      iframe.contentWindow.postMessage(`MOUSE_MOVE:${e.clientX},${e.clientY},${window.innerWidth},${window.innerHeight}`, '*');
    });

    // 2. ESCUCHA DE EVENTOS (LA MAGIA)
    window.addEventListener('message', (event) => {
      const cmd = event.data;
      
      if (cmd === 'CMD_CLOSE') closeChat();
      if (cmd === 'CMD_OPEN') openChat();

      // --- SEMÁFORO DE INTERACTIVIDAD ---
      // Si Flutter dice "Entraste a la burbuja", activamos el Iframe para que reciba el click
      if (cmd === 'HOVER_ENTER') {
        if (!wrapper.classList.contains('expanded')) {
          iframe.style.pointerEvents = 'auto';
        }
      }
      // Si sales, lo volvemos fantasma para poder clickear la web de abajo
      if (cmd === 'HOVER_EXIT') {
        if (!wrapper.classList.contains('expanded')) {
          iframe.style.pointerEvents = 'none';
        }
      }
    });

    function openChat() {
      wrapper.classList.add('expanded');
      document.body.classList.add('chat-open');
      setTimeout(() => { iframe.contentWindow.postMessage('CMD_OPEN', '*'); }, 100);
    }
    
    // El proxy sigue sirviendo de respaldo
    proxy.addEventListener('click', openChat);

    function closeChat() {
      wrapper.classList.remove('expanded');
      document.body.classList.remove('chat-open');
      iframe.contentWindow.postMessage('CMD_CLOSE', '*');
      // Al cerrar, vuelve a fantasma
      iframe.style.pointerEvents = 'none';
    }
    
    backdrop.addEventListener('click', closeChat);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
